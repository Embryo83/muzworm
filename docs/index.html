<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuzWorm - Моя Музыка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <h1>MuzWorm</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Имя пользователя" required>
            <button type="submit">Войти / Регистрация</button>
        </form>
    </div>

    <div id="app-container" style="display: none;">
        <header>
            <h1>MuzWorm</h1>
            <div id="user-info">
                <span id="welcome-msg"></span>
                <button id="logout-btn">Выйти</button>
            </div>
        </header>

        <nav>
            <button class="tab-btn active" data-tab="albums">Альбомы</button>
            <button class="tab-btn" data-tab="singles">Синглы</button>
        </nav>

        <div id="controls-area" style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <div class="sort-controls">
                <label style="color:#aaa; font-size: 0.9rem;">Сортировка:</label>
                <select id="global-sort" style="padding: 5px; background: #333; color: white; border: none; border-radius: 4px;">
                    <option value="date-desc">Дата оценки (новые)</option>
                    <option value="date-asc">Дата оценки (старые)</option>
                    <option value="rating-desc">Рейтинг (высокий)</option>
                    <option value="rating-asc">Рейтинг (низкий)</option>
                </select>
            </div>
        </div>

        <main id="content-area">
            <!-- Контент загружается через JS -->
        </main>
    </div>

    <!-- Модальное окно для Альбома (Добавление/Редактирование) -->
    <div id="album-modal" class="modal">
        <div class="modal-content modal-scrollable">
            <span class="close">&times;</span>
            <h2 id="album-modal-title">Добавить альбом</h2>
            <form id="album-form">
                <input type="hidden" id="album-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Исполнитель:</label>
                        <input type="text" id="album-artist" required>
                    </div>
                    <div class="form-group">
                        <label>Название альбома:</label>
                        <input type="text" id="album-title" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Оценка (0.0-5.0):</label>
                        <input type="number" id="album-rating" step="0.1" min="0" max="5" value="0.0" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="album-date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Топ:</label>
                        <input type="text" id="album-chart-name" placeholder="Например: Billboard 200">
                    </div>
                    <div class="form-group">
                        <label>Место в топе:</label>
                        <input type="number" id="album-chart-pos" placeholder="#">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Трек-лист:</label>
                    <div id="tracks-container"></div>
                    <button type="button" id="add-track-btn" class="secondary-btn">+ Добавить трек</button>
                </div>

                <button type="submit" class="primary-btn">Сохранить</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно для Сингла (Добавление/Редактирование) -->
    <div id="single-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="single-modal-title">Добавить сингл</h2>
            <form id="single-form">
                <input type="hidden" id="single-id">
                <div class="form-group">
                    <label>Исполнитель:</label>
                    <input type="text" id="single-artist" required>
                </div>
                <div class="form-group">
                    <label>Название сингла:</label>
                    <input type="text" id="single-title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Оценка (0.0-5.0):</label>
                        <input type="number" id="single-rating" step="0.1" min="0" max="5" value="0.0" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="single-date" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn">Сохранить</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно Детального просмотра Альбома -->
    <div id="album-detail-modal" class="modal">
        <div class="modal-content modal-scrollable">
            <span class="close" onclick="closeAlbumDetail()">&times;</span>
            <div id="album-detail-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
