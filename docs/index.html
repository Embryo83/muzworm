<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuzWorm - Моя Музыка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <h1>MuzWorm</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Имя пользователя" required>
            <button type="submit" class="primary-btn">Войти / Регистрация</button>
        </form>
    </div>

    <div id="app-container" style="display: none;">
        <header>
            <h1>MuzWorm</h1>
            <div id="user-info">
                <span id="welcome-msg"></span>
                <button id="logout-btn" class="secondary-btn">Выйти</button>
            </div>
        </header>

        <nav>
            <button class="tab-btn active" data-tab="albums">Альбомы</button>
            <button class="tab-btn" data-tab="singles">Синглы</button>
        </nav>

        <!-- Основной макет с тремя колонками -->
        <div class="main-layout">
            <!-- Левая колонка: ТОП Альбомов -->
            <aside class="sidebar left-sidebar">
                <div class="top-section">
                    <h3>🏆 ТОП-10 Альбомов</h3>
                    <div class="month-selector">
                        <input type="month" id="album-top-month">
                    </div>
                    <div id="album-top-list" class="top-list">
                        <!-- Заполняется JS -->
                    </div>
                </div>
            </aside>

            <!-- Центральная колонка: Основной контент -->
            <main id="content-area">
                <!-- Заголовки и кнопки управления генерируются JS -->
                <div id="cards-container"></div>
            </main>

            <!-- Правая колонка: ТОП Треков -->
            <aside class="sidebar right-sidebar">
                <div class="top-section">
                    <h3>🔥 ТОП-20 Треков</h3>
                    <div class="month-selector">
                        <input type="month" id="track-top-month">
                    </div>
                    <div id="track-top-list" class="top-list">
                        <!-- Заполняется JS -->
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Модальное окно: Добавление/Редактирование Альбома -->
    <div id="album-modal" class="modal">
        <div class="modal-content modal-scrollable">
            <span class="close">&times;</span>
            <h2 id="album-modal-title">Добавить альбом</h2>
            <form id="album-form">
                <input type="hidden" id="album-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Исполнитель:</label>
                        <input type="text" id="album-artist" required>
                    </div>
                    <div class="form-group">
                        <label>Название альбома:</label>
                        <input type="text" id="album-title" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Рейтинг (0.0 - 5.0):</label>
                        <input type="number" id="album-rating" step="0.1" min="0" max="5" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="album-date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Название ТОПа (опционально):</label>
                        <input type="text" id="album-chart-name" placeholder="Например: Billboard 200">
                    </div>
                    <div class="form-group">
                        <label>Место в ТОПе:</label>
                        <input type="number" id="album-chart-pos" min="1" placeholder="#">
                    </div>
                </div>

                <div class="form-group">
                    <label>Трек-лист:</label>
                    <div id="tracks-container"></div>
                    <button type="button" id="add-track-btn" class="secondary-btn small">+ Добавить трек</button>
                </div>

                <button type="submit" class="primary-btn">Сохранить альбом</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Добавление/Редактирование Сингла -->
    <div id="single-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="single-modal-title">Добавить сингл</h2>
            <form id="single-form">
                <input type="hidden" id="single-id">
                <div class="form-group">
                    <label>Исполнитель:</label>
                    <input type="text" id="single-artist" required>
                </div>
                <div class="form-group">
                    <label>Название сингла:</label>
                    <input type="text" id="single-title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Рейтинг (0.0 - 5.0):</label>
                        <input type="number" id="single-rating" step="0.1" min="0" max="5" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="single-date" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn">Сохранить сингл</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Детальный просмотр альбома -->
    <div id="album-detail-modal" class="modal">
        <div class="modal-content modal-scrollable large-modal">
            <span class="close">&times;</span>
            <div id="album-detail-header">
                <h2 id="detail-title">Название альбома</h2>
                <p id="detail-artist" class="subtitle">Исполнитель</p>
                <div class="detail-meta">
                    <span class="badge rating-badge">⭐ <span id="detail-rating"></span></span>
                    <span class="badge date-badge">📅 <span id="detail-date"></span></span>
                    <span id="detail-chart-info" class="badge chart-badge" style="display:none">🏆 <span id="detail-chart"></span></span>
                </div>
            </div>
            
            <div class="track-sort-controls">
                <span>Сортировка треков:</span>
                <button class="sort-btn active" data-sort="original">По порядку</button>
                <button class="sort-btn" data-sort="rating">По рейтингу</button>
                <button class="sort-btn" data-sort="plays">По прослушиваниям</button>
            </div>

            <div id="detail-tracks-list" class="detailed-track-list">
                <!-- Треки -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
