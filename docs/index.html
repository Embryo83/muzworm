<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuzWorm - Моя Музыка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран авторизации -->
    <div id="auth-container">
        <h1>MuzWorm</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Имя пользователя" required autocomplete="username">
            <button type="submit" class="primary-btn">Войти / Регистрация</button>
        </form>
        <p style="color: #777; font-size: 0.9rem; margin-top: 10px;">Введите имя для входа</p>
    </div>

    <!-- Основное приложение -->
    <div id="app-container" style="display: none;">
        <header>
            <div class="logo-area">
                <h1>MuzWorm</h1>
            </div>
            <div id="user-info">
                <span id="welcome-msg"></span>
                <button id="logout-btn" class="secondary-btn">Выйти</button>
            </div>
        </header>

        <nav class="main-nav">
            <button class="tab-btn active" data-tab="albums">Альбомы</button>
            <button class="tab-btn" data-tab="singles">Синглы</button>
        </nav>

        <div class="content-layout">
            <!-- Левая колонка: ТОП Альбомов (видна только на вкладке Альбомы) -->
            <aside id="left-sidebar" class="sidebar">
                <h3>ТОП-10 Альбомов</h3>
                <div class="top-selector">
                    <select id="top-albums-month"></select>
                </div>
                <div id="top-albums-list" class="top-list"></div>
            </aside>

            <!-- Центральная колонка: Основной контент -->
            <main id="content-area">
                <!-- Сюда рендерится список альбомов/синглов -->
            </main>

            <!-- Правая колонка: ТОП Треков (видна только на вкладке Альбомы) -->
            <aside id="right-sidebar" class="sidebar">
                <h3>ТОП-20 Треков</h3>
                <div class="top-selector">
                    <select id="top-tracks-month"></select>
                </div>
                <div id="top-tracks-list" class="top-list"></div>
            </aside>
        </div>
    </div>

    <!-- Модальное окно: Добавление/Редактирование Альбома -->
    <div id="album-modal" class="modal">
        <div class="modal-content modal-scrollable">
            <span class="close">&times;</span>
            <h2 id="album-modal-title">Добавить альбом</h2>
            <form id="album-form">
                <input type="hidden" id="album-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Исполнитель:</label>
                        <input type="text" id="album-artist" required>
                    </div>
                    <div class="form-group">
                        <label>Название альбома:</label>
                        <input type="text" id="album-title" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Рейтинг (0.0 - 5.0):</label>
                        <input type="number" id="album-rating" step="0.1" min="0" max="5" placeholder="4.5" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="album-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Место в топе:</label>
                    <input type="text" id="album-chart-place" placeholder="Например: 5 в Rock Top 100">
                </div>
                
                <div class="form-group">
                    <label>Трек-лист (порядок важен):</label>
                    <div id="tracks-container"></div>
                    <button type="button" id="add-track-btn" class="secondary-btn small-btn">+ Добавить трек</button>
                </div>

                <button type="submit" class="primary-btn">Сохранить альбом</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Добавление/Редактирование Сингла -->
    <div id="single-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="single-modal-title">Добавить сингл</h2>
            <form id="single-form">
                <input type="hidden" id="single-id">
                <div class="form-group">
                    <label>Исполнитель:</label>
                    <input type="text" id="single-artist" required>
                </div>
                <div class="form-group">
                    <label>Название сингла:</label>
                    <input type="text" id="single-title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Рейтинг (0.0 - 5.0):</label>
                        <input type="number" id="single-rating" step="0.1" min="0" max="5" placeholder="4.0" required>
                    </div>
                    <div class="form-group">
                        <label>Дата оценки:</label>
                        <input type="date" id="single-date" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn">Сохранить сингл</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Детальный просмотр Альбома -->
    <div id="album-detail-modal" class="modal">
        <div class="modal-content modal-scrollable large-modal">
            <span class="close">&times;</span>
            <div id="album-detail-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
